<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Predictive Faculty Allocation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-header h3 {
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        .brand-header p {
            color: #64748b;
            font-size: 0.9rem;
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <h3>PFAS Portal</h3>
        <p>Predictive Faculty Allocation System</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-warning alert-dismissible fade show p-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label for="roleSelect" class="form-label fw-semibold text-secondary">Select Login Role</label>
            <select name="role" class="form-select" id="roleSelect" required>
                <option value="admin" selected>Department Admin / HOD</option>
                <option value="faculty">Faculty Member</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="emailInput" class="form-label fw-semibold text-secondary">Email Address</label>
            <input type="email" name="email" id="emailInput" class="form-control" value="sharma@icfaitech.in" placeholder="name@icfaitech.in" required>
        </div>

        <div class="mb-4">
            <label for="passwordInput" class="form-label fw-semibold text-secondary">Password</label>
            <input type="password" name="password" id="passwordInput" class="form-control" value="password123" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign In to Dashboard</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
